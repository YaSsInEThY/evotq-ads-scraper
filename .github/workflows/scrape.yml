name: Scrape Ads and Save to Database

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: evotq-ad-collection
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 requests
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run scraper and save to database
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: python .github/scripts/scrape_and_save.py

      - name: Save collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: collection-report.json
          if-no-files-found: ignore
          retention-days: 7
